<link rel="canonical" href="https://gavinlujan.com/cio-rogue.html"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="CIO Rogue: an ASCII fantasy DevSecOps management roguelike."><title>CIO Rogue v0.3 | Gavin Lujan</title><style>*{box-sizing:border-box}body{margin:0;background:#010504;color:#a7f5c8;font:14px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace}.shell{max-width:1280px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #285b45;padding-bottom:13px}.title{color:#fff;font-size:clamp(25px,5vw,52px);letter-spacing:.07em}.sub,.muted{color:#709981}.top a,.gold{color:#e5b957}.game{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;margin-top:16px}.panel{border:1px solid #285b45;background:#030a07;padding:14px;box-shadow:0 0 34px #00170e inset}#map{white-space:pre;overflow:auto;min-height:430px;color:#c8ffe0;font-size:clamp(10px,1.2vw,15px)}.enc{border-top:1px solid #214a38;padding-top:12px}.enc h2{color:#fff;font-size:16px;margin:3px 0}.party{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:10px 0}.party button,.actions button{background:#07130d;border:1px solid #356e54;color:#baffd6;padding:8px;font:inherit;cursor:pointer;text-align:left}.party button:hover,.actions button:hover,.party button.sel{border-color:#e5b957;color:#e5b957}.actions{display:flex;flex-wrap:wrap;gap:6px}.meter{height:5px;background:#10231a;margin:2px 0 7px}.meter i{display:block;height:100%;background:#74e6aa}.attrs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;color:#9dc4ae;margin:9px 0}.attrs b{color:#fff}.log{height:180px;overflow:auto;border-top:1px solid #173c2c;padding-top:8px;color:#8fc3a7}.dice{font-size:28px;color:#fff}.danger{color:#ff907d}@media(max-width:850px){.game{grid-template-columns:1fr}.party{grid-template-columns:1fr 1fr}}</style></head><body>

<div class="shell"><header class="top"><div><div class="title">CIO: THE ROGUE GAME</div><div class="sub">v0.3 // THE ENTERPRISE DUNGEON // ASCII DEVSECOPS RPG</div></div><a href="projects.html">← PROJECTS</a></header><main class="game"><section class="panel"><div id="map"></div><div class="enc"><span class="gold">CURRENT ENCOUNTER</span><h2 id="encName"></h2><div id="encMeta" class="muted"></div><div class="party" id="party"></div><div class="actions"><button onclick="resolve()">[ENTER] Roll d20 / Lead Response</button><button onclick="travel()">[T] Explore Dungeon</button><button onclick="save()">[S] Save Chronicle</button><button onclick="newGame()">[N] New Campaign</button></div></div></section><aside class="panel"><div id="stats"></div><div class="dice" id="dice">d20: --</div><p class="muted">Choose the right specialist. Matching the encounter's preferred role grants +2. CIO attributes modify the check.</p><div class="log" id="log"></div></aside></main></div><script src="games/cio-rogue/core.js"></script><script>let g,lead='SEC',room=0;const rooms=['CIO KEEP','DEV TOWER','SOC KEEP','NETWORK FOREST','INFRA MINES','CLOUD CITADEL','PROCUREMENT SWAMP','CAB TOWER','AUDIT DUNGEON','BOARD CHAMBER'];const art=[`             ┌──── BOARD CHAMBER ────┐
             │       E  CEO ELF      │
             └──────────┬────────────┘
                        │
 ┌── DEV TOWER ──┐  ┌──┴──┐  ┌──── SOC KEEP ────┐
 │ 🧙 CODE WIZARD │──│ @CIO │──│ 🛡 SEC PALADIN    │
 └──────┬────────┘  └──┬──┘  └────────┬──────────┘
        │              │               │
  CI/CD FORGE      PROD CASTLE    NETWORK FOREST
        │             /\\_/\\           ♧ ♧ ♧
        │        D==(  @.@ )       NET ELVES
        │             \\_V_/            │
   DATA ORACLE         │          INFRA MINES
        └──────────────┼───────────────┘
                       │
              PROCUREMENT SWAMP
                  $  ~ ~  $
                       │
          C  CHANGE ADVISORY TOWER
          A  AUDITOR'S DUNGEON`];function newGame(){g=CIORogue.newState();g.encounter=CIORogue.drawEncounter();lead='SEC';room=0;msg('A new CIO takes the chair. The realm is already on fire. Naturally.');render()}function loadGame(){let x=CIORogue.load();if(x&&x.version==='0.2'){g=x;g.encounter=g.encounter||CIORogue.drawEncounter();msg('Chronicle restored from local storage.');render()}else newGame()}function save(){CIORogue.save(g);msg('✦ Chronicle sealed in local storage.')}function travel(){room=(room+1)%rooms.length;g.resources.morale=Math.max(0,g.resources.morale-1);msg('You travel to '+rooms[room]+'. Somewhere, a meeting invite appears.');render()}function resolve(){let r=CIORogue.resolve(g,lead);document.getElementById('dice').textContent='d20: '+r.roll+' + '+r.attributeMod+' + '+r.roleBonus+' = '+r.total;msg((r.success?'✦ SUCCESS ':'⚠ FAILURE ')+r.total+' vs DC '+r.dc+(r.critical?' // NATURAL 20!':r.fumble?' // NATURAL 1!':''));render()}function selectRole(r){lead=r;render()}function msg(x){let l=document.getElementById('log');l.innerHTML='<div>&gt; '+x+'</div>'+l.innerHTML}function bar(v){return '<div class="meter"><i style="width:'+v+'%"></i></div>'}function render(){let a=g.attrs,R=g.resources;document.getElementById('stats').innerHTML='<b class="gold">QUARTER '+g.quarter+' // TURN '+g.turn+' // CIO LVL '+g.level+'</b><div class="attrs">'+Object.keys(a).map(k=>'<span>'+k+' <b>'+a[k]+'</b> ('+(CIORogue.mod(a[k])>=0?'+':'')+CIORogue.mod(a[k])+')</span>').join('')+'</div>'+Object.entries(R).map(([k,v])=>k.toUpperCase()+' '+v+bar(k==='debt'?100-v:v)).join('');document.getElementById('map').textContent=art[0]+'\n\nLOCATION: '+rooms[room]+'\nQUEST: Preserve mission, people, trust and treasury.';let e=g.encounter;document.getElementById('encName').textContent=e.name;document.getElementById('encMeta').textContent='DC '+e.dc+' // CIO '+e.attr+' CHECK // IDEAL LEAD: '+e.lead;document.getElementById('party').innerHTML=g.party.map(p=>'<button class="'+(lead===p.role?'sel':'')+'" onclick="selectRole(\''+p.role+'\')">'+p.name+'<br><span class="muted">'+p.role+' · '+p.ability+'</span></button>').join('')}document.addEventListener('keydown',e=>{if(e.key==='Enter')resolve();if(e.key.toLowerCase()==='t')travel();if(e.key.toLowerCase()==='s')save();if(e.key.toLowerCase()==='n')newGame()});loadGame();</script></body></html>
